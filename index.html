<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>e-District Status Finder</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        h2 {
            color: #333;
            margin-bottom: 20px;
        }
        input[type="text"] {
            width: 90%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s;
        }
        input[type="text"]:focus {
            border-color: #007bff;
        }
        button {
            margin-top: 15px;
            width: 96%;
            padding: 12px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>e-District Status Tracker</h2>
    <p>Application Number enter karein aur enter dabayein:</p>
    
    <!-- Input Form -->
    <input type="text" id="appNo" placeholder="Enter Application No." autocomplete="off" autofocus>
    <button onclick="redirectToStatus()">Check Status</button>
</div>

<script>
    // Button click karne par function run hoga
    function redirectToStatus() {
        var appNoValue = document.getElementById('appNo').value.trim();
        
        if (appNoValue === "") {
            alert("Bhai, pehle Application Number toh dalo!");
            return;
        }
        
        // Base URL jisme number jodna hai
        var baseUrl = "https://edistrict.up.gov.in/edistrict/showStatushome.aspx?application_no=";
        
        // Final URL generate karke naye tab me open karega
        window.open(baseUrl + appNoValue, '_blank');
    }

    // Enter key press karne par bhi submit ho jaye uske liye shortcut
    document.getElementById('appNo').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') {
            redirectToStatus();
        }
    });
</script>

</body>
</html>
