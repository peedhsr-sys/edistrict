<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>eDistrict Status Tracker</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 450px;
            text-align: center;
        }

        h2 {
            color: #333;
            margin-bottom: 25px;
            font-weight: 600;
        }

        .input-group {
            margin-bottom: 20px;
        }

        input[type="text"] {
            width: 100%;
            padding: 15px;
            border: 2px solid #e1e5eb;
            border-radius: 8px;
            font-size: 16px;
            transition: all 0.3s ease;
            outline: none;
        }

        input[type="text"]:focus {
            border-color: #4a90e2;
            box-shadow: 0 0 8px rgba(74, 144, 226, 0.2);
        }

        button {
            width: 100%;
            background-color: #4a90e2;
            color: white;
            padding: 15px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #357abd;
        }

        /* Modern Loader */
        .loader-container {
            display: none;
            margin-top: 25px;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #4a90e2;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loader-text {
            color: #666;
            font-size: 14px;
            font-weight: 500;
        }

        /* Result Section */
        #resultSection {
            display: none;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #eee;
            text-align: left;
        }

        .result-item {
            margin-bottom: 12px;
            padding: 12px;
            background: #f8f9fa;
            border-radius: 6px;
            border-left: 4px solid #4a90e2;
        }

        .result-item strong {
            color: #333;
            display: block;
            margin-bottom: 4px;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .result-item span {
            color: #2c3e50;
            font-size: 15px;
            font-weight: 500;
        }

        .action-btn {
            background-color: #2ecc71;
            margin-top: 15px;
        }
        
        .action-btn:hover {
            background-color: #27ae60;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>eDistrict Status Portal</h2>
    
    <div class="input-group">
        <input type="text" id="appNumber" placeholder="Enter Application Number" autocomplete="off" />
    </div>
    
    <button id="searchBtn" onclick="startProcess()">Track Status</button>

    <!-- Background Processing Loader (No Captcha UI) -->
    <div class="loader-container" id="loader">
        <div class="spinner"></div>
        <div class="loader-text" id="loaderText">Fetching secure data...</div>
    </div>

    <!-- Final Result Display -->
    <div id="resultSection"></div>
</div>

<script>
    // Configuration URLs (Replace TARGET_SITE_URL with actual target)
    const PROXY_URL = "https://corsproxy.io/?"; 
    const TARGET_SITE_URL = "https://example-edistrict-site.gov.in/status"; 
    const OCR_API_URL = "https://copytextfrompicture.xyz/ocr/";

    async function startProcess() {
        const appNo = document.getElementById('appNumber').value.trim();
        if (!appNo) {
            alert('Please enter a valid Application Number.');
            return;
        }

        // Setup UI for processing
        document.getElementById('searchBtn').style.display = 'none';
        document.getElementById('resultSection').style.display = 'none';
        const loader = document.getElementById('loader');
        const loaderText = document.getElementById('loaderText');
        loader.style.display = 'block';
        
        try {
            // STEP 1: Fetch Captcha Image in Background (Invisible to user)
            loaderText.innerText = "Bypassing security checks...";
            
            // Dummy URL for example. Replace with how you actually get the captcha URL.
            const captchaImageUrl = "https://copytextfrompicture.xyz/sample-captcha.png"; 
            
            const img = new Image();
            img.crossOrigin = "Anonymous"; 
            img.src = captchaImageUrl;

            img.onload = async () => {
                loaderText.innerText = "Solving captcha in background...";
                const captchaText = await solveCaptchaBackground(img);
                
                if(captchaText && captchaText !== "Error" && captchaText !== "Failed") {
                    loaderText.innerText = "Retrieving application details...";
                    await fetchFinalDetails(appNo, captchaText);
                } else {
                    showError("Failed to solve security check. Please try again.");
                }
            };
            
            img.onerror = () => {
                showError("Failed to load security resources.");
            };

        } catch (err) {
            console.error(err);
            showError("Network Error Occurred.");
        }
    }

    // Advanced Background OCR Function 
    async function solveCaptchaBackground(img) {
        try {
            // Create canvas in memory (never added to DOM)
            const canvas = document.createElement('canvas');
            canvas.width = img.naturalWidth || img.width;
            canvas.height = img.naturalHeight || img.height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0);

            // Convert directly to Blob for speed
            const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
            const formData = new FormData();
            formData.append("image", blob, "captcha.png");

            // Silent API Call to your OCR server
            const ocrResponse = await fetch(OCR_API_URL, {
                method: "POST",
                body: formData
            });

            const result = await ocrResponse.json();
            
            if (result.text) {
                // Clean spaces silently
                return result.text.trim().replace(/\s+/g, '');
            } else {
                return "Failed";
            }
        } catch (err) {
            console.error("Background API Error:", err);
            return "Error"; 
        }
    }

    // Fetch details using solved captcha
    async function fetchFinalDetails(appNo, captchaCode) {
        /*
        // REAL IMPLEMENTATION EXAMPLE:
        const formData = new URLSearchParams();
        formData.append('appNo', appNo);
        formData.append('captcha', captchaCode);
        
        const res = await fetch(PROXY_URL + encodeURIComponent(TARGET_SITE_URL), {
            method: 'POST',
            body: formData
        });
        const data = await res.text();
        // Parse your data here...
        */

        // DUMMY IMPLEMENTATION FOR DEMO (Simulating network delay)
        setTimeout(() => {
            document.getElementById('loader').style.display = 'none';
            document.getElementById('searchBtn').style.display = 'block';
            
            const resultDiv = document.getElementById('resultSection');
            resultDiv.style.display = 'block';
            resultDiv.innerHTML = `
                <div class="result-item">
                    <strong>Application Status</strong>
                    <span>Approved & Generated</span>
                </div>
                <div class="result-item">
                    <strong>Remarks</strong>
                    <span>Certificate has been dispatched successfully.</span>
                </div>
                <button class="action-btn" onclick="window.open('https://example.com/details?app=${appNo}', '_blank')">
                    Click Here for Full Details
                </button>
            `;
        }, 1500);
    }

    function showError(msg) {
        document.getElementById('loader').style.display = 'none';
        document.getElementById('searchBtn').style.display = 'block';
        alert(msg);
    }
</script>

</body>
</html>
