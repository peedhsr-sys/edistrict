<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>eDistrict Tracker - IIT Edition</title>
    <style>
        body { background: #0f172a; color: white; display: flex; justify-content: center; padding-top: 50px; font-family: sans-serif; }
        .box { background: #1e293b; padding: 30px; border-radius: 12px; width: 400px; text-align: center; }
        input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 6px; border: none; }
        button { width: 100%; padding: 12px; background: #3b82f6; border: none; color: white; font-weight: bold; cursor: pointer; }
        #loader { display: none; margin-top: 15px; }
    </style>
</head>
<body>

<div class="box">
    <h2>Tracker System</h2>
    <input type="text" id="appNo" placeholder="Application Number">
    <button onclick="runTracker()">TRACK STATUS</button>
    <div id="loader">Processing Request...</div>
    <div id="result"></div>
</div>

<script>
async function runTracker() {
    const appNo = document.getElementById('appNo').value;
    const loader = document.getElementById('loader');
    loader.style.display = 'block';

    const targetUrl = `https://edistrict.up.gov.in/edistrict/showStatushome.aspx?application_no=${appNo}`;
    
    try {
        // IIT Professional Fetch Pattern: Spoofing Referer to pass firewall
        const response = await fetch("https://api.allorigins.win/raw?url=" + encodeURIComponent(targetUrl), {
            method: 'GET',
            headers: {
                'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64)',
                'Referer': 'https://edistrict.up.gov.in/'
            }
        });

        if(!response.ok) throw new Error("Blocked by Server");

        const data = await response.text();
        document.getElementById('result').innerHTML = "Status Fetched Successfully! (Check Console for details)";
        console.log("Data Received:", data); // Yaha data parse kar sakte ho
        
    } catch (e) {
        alert("Server restricted the request. Try using a VPN or local Node.js proxy.");
    } finally {
        loader.style.display = 'none';
    }
}
</script>
</body>
</html>
